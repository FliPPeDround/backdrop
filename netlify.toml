# 该文件必须放在仓库根目录：`netlify deploy` 只在当前工作目录读取 netlify.toml，
# 而 release（本地 `pnpm release` / GitHub Actions）都在根目录执行。
# 其中所有路径都相对仓库根目录解析（站点的 base 目录为空）。
# Netlify 侧的 Git 自动构建已关闭（stop_builds），生产部署只走 release 流程。
[build]
command = "pnpm --filter web run build"
publish = "packages/web/dist"

[build.environment]
NODE_VERSION = "24"

[functions]
directory = "packages/mcp/functions"

# The v2 function in packages/mcp/functions owns /mcp through its own `config.path`, and
# function routes outrank the non-forced catch-all below. Do not add a
# `/mcp` -> `/.netlify/functions/mcp` redirect: v2 functions are not published at that
# path, and a forced redirect outranks the function route, so it turns /mcp into a 404.

# 预渲染出的图案页在 dist/p/<id>/index.html。带斜杠的地址直接命中该文件，
# 不带斜杠的地址没有对应文件、会掉进下面的 catch-all 而拿到首页 HTML
# （分享卡片和标题就都变成站点的了）。这里显式补一条 301，不依赖 Netlify 的
# pretty urls 设置。`:id` 只匹配单个路径段，图案 id 里没有斜杠。
[[redirects]]
from = "/p/:id"
to = "/p/:id/"
status = 301

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
