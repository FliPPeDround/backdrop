packages:
  - packages/*

allowBuilds:
  core-js: true
  core-js-pure: true
  esbuild: true
  simple-git-hooks: true
  vue-demi: true

catalogs:
  build:
    '@iconify-json/carbon': ^1.2.27
    '@vitejs/plugin-vue': ^6.0.9
    unocss: ^66.10.5
    unplugin-auto-import: ^21.1.0
    unplugin-vue-components: ^32.1.0
    unplugin-vue-router: ^0.12.0
    vite: ^8.3.0
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@types/node': ^24.13.5
    '@unocss/eslint-plugin': ^66.10.5
    baseline-browser-mapping: ^2.11.25
    eslint: ^10.10.0
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.5.1
    simple-git-hooks: ^2.14.0
    taze: ^21.1.0
    typescript: ^6.0.3
    vue-tsc: ^3.3.11
  frontend:
    '@vueuse/core': ^15.0.0
    motion-v: ^2.4.4
    ogl: ^1.0.11
    sugar-high: ^2.4.1
    vue: ^3.5.43
    vue-router: ^5.3.1

minimumReleaseAgeExclude:
  - baseline-browser-mapping@2.11.25
